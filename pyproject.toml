[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openavatar"
version = "0.1.0"
description = "Portable identity, likeness, voice, and taste primitives for people and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kevin Rajan" }]
dependencies = []

[project.scripts]
openavatar = "openavatar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
